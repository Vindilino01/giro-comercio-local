[pytest]
# Onde procurar testes.
#
# `tests/` contem as suites do projeto. `scripts/` contem utilitarios que
# TEM "test_" no nome mas sao executaveis com `sys.exit` no final
# (test_para_float.py, test_rls.py). Sem este filtro, o pytest coleta os
# dois, o `sys.exit` interrompe a sessao e o resultado e
# "INTERNALERROR ... SystemExit" em vez de uma lista de testes.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Sem --strict-markers: os skips condicionais (Node ausente) usam
# `skipif`, que ja e builtin.
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
